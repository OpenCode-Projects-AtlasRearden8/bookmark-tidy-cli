[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-tidy"
version = "1.0.0"
description = "Pure-stdlib CLI that calms a chaotic browser bookmark export into import-ready HTML and an LLM-friendly Markdown index."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["bookmarks", "cli", "dedupe", "export", "html", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.scripts]
bookmark-tidy = "bookmark_tidy.cli:main"

[tool.setuptools]
packages = ["bookmark_tidy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
